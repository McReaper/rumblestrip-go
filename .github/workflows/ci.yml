name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions: {}

jobs:
  kit:
    # Rumblestrip's image is built first, and every check runs in it: the
    # proofs run with the tools the image carries, at the versions tools.txt
    # pins.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # the image scan's report, in the Security tab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The image's Ubuntu layer runs again once a day, for Ubuntu's security
      # fixes.
      - name: Pick the apt refresh date
        id: apt-refresh
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Build Rumblestrip's image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: APT_REFRESH=${{ steps.apt-refresh.outputs.date }}
          secrets: github_token=${{ github.token }}
          load: true
          tags: rumblestrip:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the image on the repository
        run: docker run --detach --name kit --user "$(id -u):$(id -g)" --volume "$GITHUB_WORKSPACE:/work" rumblestrip:ci sleep infinity
      - run: docker exec kit go vet ./...
      - name: Lint Rumblestrip with its own rules, for every target system
        run: |
          docker exec kit sh -euc '
            go build -o /tmp/rumblestrip-vet ./cmd/rumblestrip-vet
            for goos in linux windows; do
              GOOS=$goos golangci-lint run --config lint/golangci.yml ./...
              GOOS=$goos /tmp/rumblestrip-vet ./...
            done'
      - name: Prove every rule on the trial
        run: docker exec kit go test -race -count=1 ./...
      - name: Show that the race detector's proof ran
        run: |
          docker exec kit go test -race -count=1 -run '^TestRaceDetectorReportsEveryCase$' -v ./proof/ | grep -- '--- PASS: TestRaceDetectorReportsEveryCase'
      - name: Check Rumblestrip's own workflows and history
        run: |
          docker exec kit sh -euc '
            actionlint
            zizmor --offline .github/workflows
            gitleaks git --no-banner --redact --config .gitleaks.toml .'

      # The gates block on a finding with a fixed version: an Ubuntu package,
      # which the daily apt layer picks up, and anything critical. The rest
      # goes to the Security tab: the tools' own dependencies clear with their
      # next releases, and a finding with no fix yet has nothing to apply.
      - name: Scan the image, for the Security tab
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: rumblestrip:ci
          format: sarif
          output: trivy.sarif
          exit-code: "0"
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore.yaml
      # A fork's pull request gets a read-only token: its report can't go up.
      - if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy.sarif
          category: image
      # The gates reuse the first scan's database and analysis: restoring the
      # cache again would put an older copy over them.
      - name: Scan the image, gate on a fixable Ubuntu package
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          cache: false
          scan-type: image
          image-ref: rumblestrip:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          vuln-type: os
          ignore-unfixed: true
          skip-setup-trivy: true
          trivyignores: .trivyignore.yaml
      - name: Scan the image, gate on anything critical with a fix
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          cache: false
          scan-type: image
          image-ref: rumblestrip:ci
          format: table
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true
          skip-setup-trivy: true
          trivyignores: .trivyignore.yaml
      # Publish pushes this very image: a second build could differ.
      - name: Keep the image proven here, for publish
        if: github.event_name == 'push'
        run: docker save rumblestrip:ci | gzip -1 > "$RUNNER_TEMP/rumblestrip.tar.gz"
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: ${{ runner.temp }}/rumblestrip.tar.gz
          compression-level: 0
          retention-days: 1

  publish:
    # A push to main or a release tag publishes the image proven above, as
    # sha-<commit>: a workflow pinned at that commit runs it. A push to main
    # also tags it main; a release tag, its version and latest. Only merged
    # code runs here, so only this job may write packages.
    needs: kit
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    env:
      IMAGE: ghcr.io/mcreaper/rumblestrip
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: ${{ runner.temp }}
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish the image proven above
        run: |
          set -eu
          gunzip -c "$RUNNER_TEMP/rumblestrip.tar.gz" | docker load --quiet
          tags="sha-$GITHUB_SHA main"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tags="sha-$GITHUB_SHA $GITHUB_REF_NAME latest"
          fi
          for tag in $tags; do
            docker tag rumblestrip:ci "$IMAGE:$tag"
            docker push --quiet "$IMAGE:$tag"
          done
